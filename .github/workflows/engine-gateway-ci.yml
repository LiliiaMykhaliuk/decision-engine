name: gateway-ci

on:
  push:
    paths:
      - "services/gateway-api/**"
      - ".github/workflows/gateway-ci.yml"
  pull_request:
    paths:
      - "services/gateway-api/**"
      - ".github/workflows/gateway-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/gateway-api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/gateway-api/requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q
